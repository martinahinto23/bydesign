<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Design Studio</title>
  <link rel="stylesheet" href="./style.css"/>
</head>
<body>
  <div id="designerApp">
    <div class="wrap">
      <div class="card">
        <div class="header">
          <h1>Design Studio</h1>
          <p>Choose your garment, size, color, and placement before previewing.</p>
        </div>

        <div class="grid">
          <div class="form">
            <div class="row">
              <div class="field">
                <label for="garment">Garment</label>
                <select id="garment"></select>
              </div>

              <div class="field">
                <label for="size">Size</label>
                <select id="size"></select>
              </div>
            </div>

            <div class="row">
              <div class="field">
                <label for="color">Color</label>
                <select id="color"></select>
              </div>

              <div class="field">
                <label for="placement">Placement</label>
                <select id="placement"></select>
              </div>
            </div>

            <div class="field">
              <label for="frontDesign">Front Design</label>
              <select id="frontDesign"></select>
            </div>

            <div class="field back-wrap" id="backWrap">
              <label for="backDesign">Back Design</label>
              <select id="backDesign"></select>
            </div>

            <div class="actions">
              <button class="btn preview" id="previewBtn" type="button">Preview</button>
              <button class="btn cart" id="cartBtn" type="button">Add to cart</button>
            </div>
          </div>
          <input type="hidden" id="printful_variant_id" />
          <input type="hidden" id="printful_product_id" />

          <div class="preview-panel">
            <div class="preview-box" id="previewBox">
              <div>
                <strong>Preview Area</strong>
              </div>
            </div>

            <div class="summary" id="summary"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
