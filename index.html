<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Here</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="designerApp">
    <div class="wrap">
      <div class="card">
        <div class="header">
          <h1>Design Your Garment</h1>
          <p>Choose your garment, size, color, and placement before previewing and adding to cart.</p>
        </div>

        <div class="grid">
          <div class="form">
            <div class="row">
              <div class="field">
                <label for="garmentType">Garment type</label>
                <select id="garmentType">
                  <option value="">Select garment</option>
                  <option value="tee">Tee</option>
                  <option value="hoodie">Hoodie</option>
                  <option value="sweatshirt">Sweatshirt</option>
                  <option value="tank">Tank</option>
                </select>
              </div>

              <div class="field">
                <label for="size">Size</label>
                <select id="size">
                  <option value="">Select size</option>
                  <option>S</option>
                  <option>M</option>
                  <option>L</option>
                  <option>XL</option>
                  <option>2XL</option>
                  <option>3XL</option>
                  <option>4XL</option>
                  <option>5XL</option>
                </select>
              </div>
            </div>

            <div class="row">
              <div class="field">
                <label for="color">Color</label>
                <select id="color">
                  <option value="">Select color</option>
                  <option>Black</option>
                  <option>White</option>
                  <option>Forest Green</option>
                  <option>Red</option>
                  <option>Gold</option>
                  <option>Team Royal</option>
                  <option>Graphite Heather</option>
                </select>
              </div>

              <div class="field">
                <label for="placementMode">Placement mode</label>
                <select id="placementMode">
                  <option value="">Select placement</option>
                  <option value="front">Front only</option>
                  <option value="back">Back only</option>
                  <option value="front-back">Front + Back</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label for="frontDesign">Front design</label>
              <select id="frontDesign">
                <option value="">Select front design</option>
                <option value="design-1">Design 1</option>
                <option value="design-2">Design 2</option>
                <option value="design-3">Design 3</option>
              </select>
            </div>

            <div class="field back-wrap" id="backWrap">
              <label for="backDesign">Back design</label>
              <select id="backDesign">
                <option value="">Select back design</option>
                <option value="back-1">Back Design 1</option>
                <option value="back-2">Back Design 2</option>
                <option value="back-3">Back Design 3</option>
              </select>
            </div>

            <div class="actions">
              <button class="btn preview" id="previewBtn" type="button">Preview</button>
              <button class="btn cart" id="cartBtn" type="button">Add to cart</button>
            </div>
          </div>

          <div class="preview">
            <div class="preview-box" id="previewBox">
              <div>
                <strong>Preview Area</strong>
                Your garment preview will appear here.
              </div>
            </div>

            <div class="summary" id="summary">
              <strong>Selection summary</strong><br />
              Garment: —<br />
              Size: —<br />
              Color: —<br />
              Placement: —<br />
              Front design: —<br />
              Back design: —
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
